<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="theme-color" content="#0b1638">
  <title>卡卡學寫字｜寫字・筆順</title>
  <link rel="stylesheet" href="css/hanzi-write-demo.css?v=hanzi-write">
</head>
<body>
  <main class="hw-shell">
    <header class="topbar">
      <a id="back-link" class="back-link" href="index.html#screen-topics">← 中文</a>
      <div class="brand">
        <span id="brand-kicker">寫字・筆順</span>
        <h1 id="brand-title">卡卡學寫字</h1>
      </div>
      <div id="star-pill" class="star-pill" aria-live="polite">★ 0</div>
    </header>

    <section id="view-profile" class="view" aria-labelledby="profile-heading">
      <div class="hero-card">
        <div class="sky-art" aria-hidden="true">
          <span class="planet planet-a"></span>
          <span class="planet planet-b"></span>
          <span class="rocket"></span>
        </div>
        <h2 id="profile-heading">你是誰？</h2>
        <p>選頭像，開始太空寫字冒險。進度只記在這部機，不會上傳。</p>
        <div class="profile-pick-grid">
          <button type="button" class="profile-card" id="btn-profile-kaka" aria-label="卡卡">
            <img class="profile-card-img" src="./assets/profile-kaka.jpg" alt="" width="384" height="384" decoding="async">
            <span class="profile-card-name">卡卡</span>
          </button>
          <button type="button" class="profile-card" id="btn-profile-heihei" aria-label="禧禧">
            <img class="profile-card-img" src="./assets/profile-heihei.jpg" alt="" width="384" height="384" decoding="async">
            <span class="profile-card-name">禧禧</span>
          </button>
        </div>
      </div>
    </section>

    <section id="view-adventure" class="view hidden" aria-labelledby="adventure-heading">
      <div class="hero-card adventure-card">
        <div class="sky-art sky-art-lg" aria-hidden="true">
          <span class="star-dust"></span>
          <span class="planet planet-a"></span>
          <span class="planet planet-b"></span>
          <span class="rocket rocket-fly"></span>
        </div>
        <p class="who-line" id="who-line">卡卡，準備好未？</p>
        <h2 id="adventure-heading">開始冒險</h2>
        <p id="adventure-lead">坐火箭去寫字星球，跟著橙色線，在米字格寫十二個字。由「星」開始，再寫月、一、大……</p>
        <div class="level-bank" id="level-bank" role="list" aria-label="十二關字庫"></div>
        <button type="button" class="primary-btn" id="btn-start-adventure">開始冒險</button>
      </div>
    </section>

    <section id="view-write" class="view write-view hidden" aria-labelledby="write-heading">
      <div class="write-spread">
        <div class="mizi-wrap">
          <p class="level-kicker" id="level-kicker">第一關</p>
          <h2 id="write-heading">寫「星」</h2>
          <p class="write-lead" id="write-lead">先看筆順，再自己寫一次。</p>
          <div class="mizi-board" aria-label="米字格">
            <svg class="mizi-grid" viewBox="0 0 100 100" aria-hidden="true">
              <rect x="1.5" y="1.5" width="97" height="97" rx="4"></rect>
              <line x1="50" y1="2" x2="50" y2="98"></line>
              <line x1="2" y1="50" x2="98" y2="50"></line>
              <line x1="2" y1="2" x2="98" y2="98"></line>
              <line x1="98" y1="2" x2="2" y2="98"></line>
            </svg>
            <div id="hanzi-target" class="hanzi-target"></div>
          </div>
        </div>
        <aside class="write-panel">
          <p id="write-status" class="status-note" role="status">跟著橙色線，一筆一筆寫。</p>
          <div class="btn-stack">
            <button type="button" class="primary-btn" id="btn-guide">看筆順</button>
            <button type="button" class="ghost-btn" id="btn-rewrite">再寫一次</button>
            <button type="button" class="ghost-btn" id="btn-next-char" hidden>下一個</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="pass-overlay" class="pass-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pass-title">
    <div class="pass-card">
      <div class="pass-sky" aria-hidden="true">
        <span class="rocket rocket-win"></span>
      </div>
      <p class="pass-stars" aria-hidden="true">★★★</p>
      <h2 id="pass-title">過關啦！</h2>
      <p id="pass-copy">三顆星星已亮起。完成一輪，獎勵一枚星星幣。</p>
      <p id="pass-coin" class="pass-coin">＋1 星星幣</p>
      <div class="pass-actions">
        <button type="button" class="primary-btn" id="btn-next-level">下一關</button>
        <button type="button" class="ghost-btn" id="btn-pass-rewrite" hidden>再寫一次</button>
        <button type="button" class="ghost-btn" id="btn-pass-home">返主頁</button>
      </div>
    </div>
  </div>

  <script src="js/no-zoom.js?v=hanzi-write"></script>
  <script src="js/nav-back.js?v=hanzi-write"></script>
  <script src="js/storage.js?v=hanzi-write"></script>
  <script src="js/speech.js?v=hanzi-write"></script>
  <script src="vendor/hanzi-writer/hanzi-writer.min.js?v=3.7.3"></script>
  <script src="data/hanzi-write-chars.js?v=hanzi-write"></script>
  <script src="js/hanzi-write-demo.js?v=hanzi-write"></script>
</body>
</html>

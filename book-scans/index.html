<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d1b69" />
  <title>書本掃描・卡卡學習</title>
  <link rel="icon" href="../assets/icons/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png" />
  <style>
    @font-face {
      font-family: "Noto Sans HK";
      src: url("../assets/fonts/noto-sans-hk-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans HK";
      src: url("../assets/fonts/noto-sans-hk-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --space-deep: #1a1040;
      --ink: #f8fafc;
      --ink-dim: rgba(248, 250, 252, 0.82);
      --gold-soft: #fde68a;
      --teal-soft: #6ee7b7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--space-deep);
      color: var(--ink);
      font-family: "Noto Sans HK", "PingFang HK", system-ui, sans-serif;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 560px at 8% -8%, rgba(110, 231, 183, 0.22), transparent 58%),
        radial-gradient(720px 480px at 92% 4%, rgba(251, 191, 36, 0.16), transparent 52%),
        linear-gradient(180deg, #1a1040 0%, #2d1b69 48%, #3b2a7a 100%);
    }
    .shelf {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--teal-soft);
      letter-spacing: 0.12em;
      font-size: 0.82rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
    }
    .note {
      margin: 0 0 18px;
      color: var(--ink-dim);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .back {
      margin: 0 0 22px;
    }
    .back a {
      color: var(--gold-soft);
      font-weight: 700;
      text-decoration: none;
    }
    .books {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .books a {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 14px 16px;
      border-radius: 22px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(52, 36, 104, 0.84);
      box-shadow: 0 10px 24px rgba(26, 16, 64, 0.28);
      border: 1px solid rgba(253, 230, 138, 0.22);
    }
    .cover {
      font-size: 2rem;
      line-height: 1;
      width: 2.2em;
      text-align: center;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .series {
      color: var(--teal-soft);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .title {
      font-size: 1.18rem;
      font-weight: 700;
    }
    .action {
      color: var(--gold-soft);
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="shelf">

    <h1>書本掃描</h1>
    <p class="note">呢啲係屋企自用嘅學習掃描，唔作外傳。</p>
    <p class="back"><a href="../">← 返主頁</a></p>
    <ul class="books">

          <span class="cover" aria-hidden="true">🎈</span>

            <span class="series">紅輯 ①</span>
            <span class="title">我的氣球呢</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
      <li>
        <a href="红③雨傘-scan.pdf" target="_blank" rel="noopener noreferrer">

      </li>
      <li>

          <span class="meta">
            <span class="series">紅輯 ⑤</span>
            <span class="title">分果果</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
      <li>
        <a href="红⑥快跑呀-scan.pdf" target="_blank" rel="noopener noreferrer">
          <span class="cover" aria-hidden="true">🏃</span>
          <span class="meta">
            <span class="series">紅輯 ⑥</span>
            <span class="title">快跑呀</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
      <li>
        <a href="红⑨一束花-scan.pdf" target="_blank" rel="noopener noreferrer">
          <span class="cover" aria-hidden="true">💐</span>
          <span class="meta">
            <span class="series">紅輯 ⑨</span>
            <span class="title">一束花</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
      <li>
        <a href="红⑪小明和氣球-scan.pdf" target="_blank" rel="noopener noreferrer">
          <span class="cover" aria-hidden="true">🎈</span>
          <span class="meta">
            <span class="series">紅輯 ⑪</span>
            <span class="title">小明和氣球</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
      <li>
        <a href="红⑫冬冬請客-scan.pdf" target="_blank" rel="noopener noreferrer">
          <span class="cover" aria-hidden="true">🍽️</span>
          <span class="meta">
            <span class="series">紅輯 ⑫</span>
            <span class="title">冬冬請客</span>
          </span>
          <span class="action">開啟 PDF</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>

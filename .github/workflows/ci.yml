name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    name: 硬性約束檢查（AGENTS.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax + AGENTS.md 硬性約束
        run: python3 scripts/check-invariants.py

      - name: 模擬部署（確保 _site 齊料）
        run: |
          bash scripts/build-site.sh _site "${GITHUB_SHA::7}"
          test -f _site/index.html
          test -f _site/.nojekyll
          grep -q "?v=${GITHUB_SHA::7}" _site/index.html

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    name: 硬性約束檢查（AGENTS.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝檢查依賴
        run: pip install --quiet pillow fonttools brotli

      - name: JS syntax + AGENTS.md 硬性約束
        run: python3 scripts/check-invariants.py

      - name: storage.js 單元測試
        run: node scripts/test-storage.mjs

      - name: 模擬部署（確保 _site 齊料）
        run: |
          bash scripts/build-site.sh _site "${GITHUB_SHA::7}"
          test -f _site/index.html
          test -f _site/.nojekyll
          grep -q "?v=${GITHUB_SHA::7}" _site/index.html

  layout:
    name: iPad 版面回歸（唔准要捲）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 playwright
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: 開靜態伺服器
        run: |
          python3 -m http.server 5173 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173/ >/dev/null && break
            sleep 0.5
          done

      - name: 5 種 iPad 尺寸 × 全部畫面
        run: python3 scripts/smoke-shots.py --no-shots

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 上線前最後一道閘：硬性約束唔過就唔部署
      - name: 安裝檢查依賴
        run: pip install --quiet pillow

      - name: 硬性約束檢查
        run: python3 scripts/check-invariants.py

      - name: iPad／iPhone 版面回歸（唔准要捲、唔准重疊）
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 5173 &
          for i in $(seq 1 20); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 0.5; done
          python3 scripts/smoke-shots.py --no-shots

      - name: Prepare static site
        run: bash scripts/build-site.sh _site "${GITHUB_SHA::7}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: Deploy kaka-learn to GitHub Pages
